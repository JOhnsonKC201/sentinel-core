    status: supported
    motivation: "Preserving host system responsiveness while maintaining zero-day pre-execution blocking capabilities."
    parent: null
    priority: high

  - id: H2
    statement: "Coupling sliding-window file modification velocity with write-entropy delta and parent process lineage enables detection of zero-day ransomware bursts within <= 3 file writes while keeping false positives on high-throughput developer workloads (compilers, git, npm) to < 0.01%."
    status: active
    motivation: "Solving the primary operational failure mode of modern heuristic EDRs on technical workstations."
    parent: null
    priority: high

  - id: H3
    statement: "Pre-allocated Lookaside Lists and fixed 8-byte aligned memory frames eliminate non-paged kernel pool allocations during IRP_MJ_CREATE storms, sustaining zero BSOD crashes and sub-2% CPU overhead across 50,000 stress operations."
